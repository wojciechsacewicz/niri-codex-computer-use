name: Arch source build and background control
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the Arch build image
        run: docker build -t nccu-arch -f ci/arch.Dockerfile .
      - name: Fingerprint the build environment
        id: toolchain
        run: |
          docker run --rm nccu-arch bash -c '{ rustc -Vv; pacman -Q; }' > "$RUNNER_TEMP/nccu-toolchain.txt"
          printf 'digest=%s\n' "$(sha256sum "$RUNNER_TEMP/nccu-toolchain.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            .local/cargo-home/git
            .local/cargo-cache
          key: arch-native-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('sources.lock.json', 'patches/**/*.patch') }}
      - name: Build pinned sources as a normal user
        run: |
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work" --env NCCU_JOBS=2 --env CARGO_HOME=/work/.local/cargo-home --env NCCU_CARGO_CACHE=/work/.local/cargo-cache nccu-arch bash -c 'chown -R builder:builder /work; exec runuser -u builder -- bash scripts/ci-arch.sh build'
      - name: Test and package without network access
        run: |
          docker run --rm --network none --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work" --env NCCU_TEST_NETWORK_NONE=1 nccu-arch bash -c 'chown -R builder:builder /work; exec runuser -u builder -- bash scripts/ci-arch.sh check'
