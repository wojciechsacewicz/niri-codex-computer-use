name: Source and adapter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check project sources
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/*.sh packaging/arch/niri-codex-session packaging/arch/niri-codex-computer-use
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          make prepare
      - name: Check native adapter contracts
        working-directory: build/codex-desktop-linux
        run: |
          node --test linux-features/computer-use-linux/native.test.js linux-features/computer-use-linux/unified.test.js linux-features/computer-use-linux/host-service.test.js linux-features/computer-use-linux/test.js
